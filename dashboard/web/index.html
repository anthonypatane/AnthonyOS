<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Character Encoding -->
    <meta charset="UTF-8">

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser Tab Title -->
    <title>Anthony OS</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript -->
    <script src="../../scripts/progression.js" defer></script>
    <script src="../../scripts/workout-storage.js" defer></script>
    <script src="../../scripts/anthony-core.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header class="header">

        <div class="title-section">
            <h1>Anthony OS</h1>
            <p class="subtitle">Your Personal Operating System</p>
        </div>

        <div id="clock-container">
            <h2 id="clock">--:--</h2>
            <p id="date">Loading...</p>
        </div>

    </header>

    <!-- ========================= -->
    <!-- DASHBOARD -->
    <!-- ========================= -->

    <main id="dashboard-grid">

        <!-- Weather -->
        <section class="card">
            <h3>☀ Weather</h3>
            <p>Coming Soon</p>
        </section>

        <!-- Classes -->
        <section class="card">
            <h3>🎓 Today's Classes</h3>
            <p>Coming Soon</p>
        </section>

        <section class="card" id="workout-card">
            <h3>🏋 Today's Workout</h3>
        
            <p id="workout-name">Loading workout...</p>
        
            <div id="workout-goals"></div>
        </section>

        <!-- Homework -->
        <section class="card">
            <h3>📚 Homework</h3>
            <p>Coming Soon</p>
        </section>

        <!-- Protein -->
        <section class="card">
            <h3>🍗 Protein</h3>
            <p id="protein-value">0 / 180 g</p>
        </section>

        <!-- Water -->
        <section class="card">
            <h3>💧 Water</h3>
            <p id="water-value">0 / 4 L</p>
        </section>

        <!-- Steps -->
        <section class="card">
            <h3>🚶 Steps</h3>
            <p id="steps-value">0 / 10,000</p>
        </section>

        <!-- Spotify -->
        <section class="card">
            <h3>🎵 Spotify</h3>
            <p>Nothing Playing</p>
        </section>

    </main>

</body>

</html>
